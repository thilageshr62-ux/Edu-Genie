<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGenie | AI Learning Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
<header class="hero">
    <div class="container">
        <div class="badge">AI POWERED LEARNING</div>
        <h1>EduGenie</h1>
        <p>Ask, understand, practice, summarize and plan your learning with Gemini.</p>
    </div>
</header>

<main class="container main-grid">
    <section class="card controls">
        <h2>What do you want to learn?</h2>

        <label for="task">Choose a task</label>
        <select id="task">
            <option value="qa">Ask a Question</option>
            <option value="explain">Explain a Concept</option>
            <option value="quiz">Generate Quiz</option>
            <option value="summarize">Summarize Text</option>
            <option value="learn">Learning Path</option>
        </select>

        <label for="level" id="level-label" class="hidden">Your level</label>
        <select id="level" class="hidden">
            <option>Beginner</option>
            <option>Intermediate</option>
            <option>Advanced</option>
        </select>

        <label for="inputText" id="input-label">Question</label>
        <textarea id="inputText" rows="11" placeholder="Example: Which is the largest ocean?"></textarea>

        <button id="submitBtn">Generate Answer</button>
        <p id="status" class="status"></p>
    </section>

    <section class="card result-card">
        <div class="result-header">
            <h2>EduGenie Result</h2>
            <button id="copyBtn" class="secondary">Copy</button>
        </div>
        <div id="result" class="result empty">
            Your generated result will appear here.
        </div>
    </section>
</main>

<footer>
    <p>EduGenie • FastAPI + Google Gemini</p>
</footer>

<script src="{{ url_for('static', path='app.js') }}"></script>
</body>
</html>
